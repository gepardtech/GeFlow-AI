  <script>
    (function() {
      // 1. Early capture of unhandled network errors (e.g. Failed to fetch)
      window.addEventListener("unhandledrejection", function(event) {
        var reason = event.reason;
        var msg = (reason && reason.message) ? reason.message : String(reason || "");
        if (/failed to fetch|networkerror|load failed|aborted|edge function returned a non-2xx/i.test(msg)) {
          event.preventDefault();
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          console.warn("Caught unhandled network rejection safely:", msg);
        }
      }, true);

      window.addEventListener("error", function(event) {
        var msg = (event && event.message) ? event.message : "";
        if (/failed to fetch|networkerror|load failed|script error/i.test(msg)) {
          event.preventDefault();
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          console.warn("Caught global network error safely:", msg);
        }
      }, true);

      // 2. Resilient fetch wrapper
      try {
        if (typeof window !== "undefined" && typeof window.fetch === "function") {
          var nativeFetch = window.fetch.bind(window);
          var resilientFetch = async function(input, init) {
            try {
              return await nativeFetch(input, init);
            } catch (err) {
              console.warn("Resilient fetch intercepted network failure:", input, err);
              var url = typeof input === "string" ? input : (input && input.url) ? input.url : String(input || "");
              if (url.indexOf("/auth/") !== -1 || url.indexOf("/api/") !== -1) {
                throw err;
              }
              if (url.indexOf("/functions/v1/currency-rates") !== -1) {
                return new Response(JSON.stringify({
                  rates: { USD: 1, EUR: 0.92, GBP: 0.79, MAD: 10.05, EGP: 48.5, SAR: 3.75, AED: 3.67, CAD: 1.36, AUD: 1.52, JPY: 155.0 }
                }), {
                  status: 200,
                  headers: { "Content-Type": "application/json" }
                });
              }
              if (url.indexOf("/functions/v1/translate-batch") !== -1) {
                return new Response(JSON.stringify({ translations: [] }), {
                  status: 200,
                  headers: { "Content-Type": "application/json" }
                });
              }
              if (url.indexOf("/functions/v1/geflow-ai-assistant") !== -1) {
                return new Response(JSON.stringify({ reply: "" }), {
                  status: 200,
                  headers: { "Content-Type": "application/json" }
                });
              }
              return new Response("[]", {
                status: 200,
                headers: { "Content-Type": "application/json", "content-range": "0-0/0" }
              });
            }
          };

          var currentFetch = resilientFetch;
          Object.defineProperty(window, "fetch", {
            get: function() {
              return currentFetch;
            },
            set: function(fn) {
              currentFetch = typeof fn === "function" ? fn : resilientFetch;
            },
            configurable: true,
            enumerable: true,
          });
        }
      } catch (e) {
        console.warn("Fetch descriptor setup note:", e);
      }
    })();
  </script>
