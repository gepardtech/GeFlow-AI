            } catch (_) {}

        }

        // Global unhandledrejection guard: prevents any unhandled network 'Failed to fetch' error from bubbling as uncaught fatal
        if (typeof window !== "undefined") {
          window.addEventListener("unhandledrejection", function(event) {
            var reason = event && event.reason;
