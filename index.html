    (function() {
      // Ensure window.fetch has both a getter and setter to prevent "Cannot set property fetch of #<Window> which has only a getter"
      try {
        if (typeof window !== "undefined" && typeof window.fetch === "function") {
          var nativeFetch = window.fetch.bind(window);
          var activeFetch = nativeFetch;

          try {
            Object.defineProperty(window, "fetch", {
              get: function() {
                return activeFetch;
              },
              set: function(fn) {
                activeFetch = typeof fn === "function" ? fn : activeFetch;
              },
              configurable: true,
              enumerable: true
            });
          } catch (_) {}

          try {
            if (typeof Window !== "undefined" && Window.prototype) {
              var pDesc = Object.getOwnPropertyDescriptor(Window.prototype, "fetch");
              if (pDesc && pDesc.configurable && !pDesc.set) {
                Object.defineProperty(Window.prototype, "fetch", {
                  get: function() {
                    return activeFetch;
                  },
                  set: function(fn) {
                    activeFetch = typeof fn === "function" ? fn : activeFetch;
                  },
                  configurable: true,
                  enumerable: true
                });
              }
            }
          } catch (_) {}

          try {
            if (typeof globalThis !== "undefined" && globalThis !== window) {
              Object.defineProperty(globalThis, "fetch", {
                get: function() {
                  return activeFetch;
                },
                set: function(fn) {
                  activeFetch = typeof fn === "function" ? fn : activeFetch;
                },
                configurable: true,
                enumerable: true
              });
            }
          } catch (_) {}
        }
      } catch (_) {}

      // Early capture of unhandled network errors
      window.addEventListener("unhandledrejection", function(event) {
        var reason = event.reason;
        var msg = (reason && reason.message) ? reason.message : String(reason || "");
        if (/failed to fetch|networkerror|load failed|aborted|edge function returned a non-2xx/i.test(msg)) {
          console.warn("Caught unhandled network rejection safely:", msg);
        }
      }, true);

      window.addEventListener("error", function(event) {
        var msg = (event && event.message) ? event.message : "";
        if (/failed to fetch|networkerror|load failed|script error/i.test(msg)) {
          console.warn("Caught global network error safely:", msg);
        }
      }, true);
    })();
