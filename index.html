    (function() {
      try {
        if (typeof window !== "undefined" && typeof window.fetch === "function") {
          var currentFetch = window.fetch.bind(window);
          Object.defineProperty(window, "fetch", {
            get: function() {
              return currentFetch;
            },
            set: function(fn) {
              currentFetch = typeof fn === "function" ? fn : window.fetch;
            },
            configurable: true,
            enumerable: true,
          });
        }
      } catch (e) {
        console.warn("Fetch descriptor setup failed", e);
      }
    })();
